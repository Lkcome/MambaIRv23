# general settings for Duke PAM x4 SR training
name: MaIR_DukePAM_x4
model_type: MambaIRModel
scale: 4
num_gpu: 4
manual_seed: 10

# dataset and data loader settings
datasets:
  train:
    task: SR
    name: Duke_PAM_train
    type: PairedImageDataset

    dataroot_gt: /data/lgl/PAMexp/2025-CVPR-MaIR/datasets/Duke_PAM_datasets_xyraw/train/HR_x4
    dataroot_lq: /data/lgl/PAMexp/2025-CVPR-MaIR/datasets/Duke_PAM_datasets_xyraw/train/LR_S4

    filename_tmpl: '{}_pam44'

    io_backend:
      type: disk

    gt_size: 192
    use_hflip: true
    use_rot: true

    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 1
    dataset_enlarge_ratio: 100
    prefetch_mode: ~

  val:
    name: Duke_PAM_valid
    type: PairedImageDataset

    dataroot_gt: /data/lgl/PAMexp/2025-CVPR-MaIR/datasets/Duke_PAM_datasets_xyraw/valid/HR_x4
    dataroot_lq: /data/lgl/PAMexp/2025-CVPR-MaIR/datasets/Duke_PAM_datasets_xyraw/valid/LR_S4

    filename_tmpl: '{}_pam44'

    io_backend:
      type: disk

# network structures
network_g:
  type: MaIR
  upscale: 4
  in_chans: 3
  img_range: 1.
  d_state: 16
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 180
  ssm_ratio: 2.0
  mlp_ratio: 2.5
  upsampler: pixelshuffle
  resi_connection: 1conv

  img_size: 48
  dynamic_ids: false
  scan_len: 8

# pretrained model and resume
path:
  pretrain_network_g: ckpt/MaIR_SR_x2.pth
  strict_load_g: false
  resume_state: ~

# training settings
train:
  optim_g:
    type: Adam
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [125000, 200000, 225000, 237500]
    gamma: 0.5

  total_iter: 250000
  warmup_iter: -1

  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

# validation settings
val:
  val_freq: !!float 5e3
  val_freq_final: !!float 5e3
  val_milestone: 0
  save_img: false

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true

    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true

# logging settings
logger:
  print_freq: 200
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true

  wandb:
    project: ~
    resume_id: ~

# distributed training settings
dist_params:
  backend: nccl
  port: 29500