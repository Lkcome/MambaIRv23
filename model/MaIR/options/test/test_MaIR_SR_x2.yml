# general settings
name: test_MaIR_DukePAM_x2
model_type: MambaIRModel
scale: 2
num_gpu: 1
manual_seed: 10

datasets:
  test_1:
    name: Duke_PAM_valid
    type: PairedImageDataset

    dataroot_gt: /data/lgl/PAMexp/2025-CVPR-MaIR/datasets/Duke_PAM_datasets_xyraw/valid/HR_x2
    dataroot_lq: /data/lgl/PAMexp/2025-CVPR-MaIR/datasets/Duke_PAM_datasets_xyraw/valid/LR_S2

    filename_tmpl: '{}_pam22'

    io_backend:
      type: disk

# network structures
network_g:
  type: MaIR
  upscale: 2
  in_chans: 3
  img_range: 1.0
  d_state: 16
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 180
  ssm_ratio: 2.0
  mlp_ratio: 2.5
  upsampler: pixelshuffle
  resi_connection: 1conv

  img_size: 64
  dynamic_ids: false
  scan_len: 8

# path
path:
  pretrain_network_g: /data/lgl/PAMexp/2025-CVPR-MaIR/experiments/MaIR_DukePAM_x2/models/net_g_BEST_ITER.pth
  strict_load_g: true

# validation settings
val:
  save_img: true
  suffix: ~

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 2
      test_y_channel: true

    ssim:
      type: calculate_ssim
      crop_border: 2
      test_y_channel: true