# general settings
name: train_SRFormer_SRx4_scratch
model_type: SwinIRModel
scale: 4
num_gpu: 1
manual_seed: 0

# dataset and data loader settings
datasets:
  train:
    name: Duke_PAM_train_x4
    type: PairedImageDataset
    dataroot_gt: /data1/like/MambaIRv21/datasets/Duke_PAM_datasets_xyraw/train/HR_x4
    dataroot_lq: /data1/like/MambaIRv21/datasets/Duke_PAM_datasets_xyraw/train/LR_S4
    filename_tmpl: '{}_pam44'
    io_backend:
      type: disk
    gt_size: 192
    use_hflip: true
    use_rot: true

    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 1
    prefetch_mode: ~


  val:
    name: Duke_PAM_valid_x4
    type: PairedImageDataset
    dataroot_gt: /data1/like/MambaIRv21/datasets/Duke_PAM_datasets_xyraw/valid/HR_x4
    dataroot_lq: /data1/like/MambaIRv21/datasets/Duke_PAM_datasets_xyraw/valid/LR_S4
    io_backend:
      type: disk
    filename_tmpl: '{}_pam44'


# network structures
network_g:
  type: SRFormer
  upscale: 4
  in_chans: 3
  img_size: 48
  window_size: 24
  img_range: 1.
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 180
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 2
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'
  print_network: false
# pretrain path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [250000, 400000, 450000, 475000]
    gamma: 0.5

  total_iter: 500000
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

# validation settings
val:
  val_freq: !!float 5e3
  save_img: false

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 28500
