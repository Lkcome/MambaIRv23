# general settings
name: test_MambaIRv2_DukePAM_x8
model_type: MambaIRv2Model
scale: 8
num_gpu: 1
manual_seed: 10

datasets:
  test_1:
    name: DuKe photoacoustic microscopy datasets
    type: PairedImageDataset

    dataroot_gt: /data1/like/MambaIRv21/datasets/Duke_PAM_datasets_xyraw/valid/HR_x8
    dataroot_lq: /data1/like/MambaIRv21/datasets/Duke_PAM_datasets_xyraw/valid/LR_S8

    filename_tmpl: '{}_pam88'

    io_backend:
      type: disk

# network structures
network_g:
  type: MambaIRv2
  upscale: 8
  in_chans: 3
  img_size: 16
  img_range: 1.

  embed_dim: 174
  d_state: 16
  depths: [6, 6, 6, 6, 6, 6]
  num_heads: [6, 6, 6, 6, 6, 6]

  window_size: 16
  inner_rank: 64
  num_tokens: 128
  convffn_kernel_size: 5
  mlp_ratio: 2.

  upsampler: pixelshuffle
  resi_connection: 1conv

  # dual-scan configuration
  dual_scan: true
  use_guidance: true

  scan_opts:
    dynamic_idx: true
    fusion: temporal
    fuse: [3, 1]
    idx_update_interval: 200
    stripe: 8
    kappa: 1.0
    block_base: 8
    ds: 2
    interleave: [3, 1]
    steps: 3

# path
path:
  pretrain_network_g: /data1/like/MambaIRv23/experiments/MambaIRv2_SR_x8_dualscan_scratch/models/net_g_140000.pth
  strict_load_g: true

# validation settings
val:
  save_img: true
  suffix: ~

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 8
      test_y_channel: true

    ssim:
      type: calculate_ssim
      crop_border: 8
      test_y_channel: true